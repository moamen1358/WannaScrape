services:
  wannascrape:
    build: .
    image: moamen1358/wannascrape:latest
    container_name: wannascrape
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - SCRAPER_HEADLESS=true
      - SCRAPER_PROXY_ENABLED=false
      - SCRAPER_CAPTCHA_ENABLED=false
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-}
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
