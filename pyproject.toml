[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "website-scraper"
version = "2.0.0"
description = "Production-ready web scraper with anti-detection features"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "moamen1358"}
]
keywords = ["web-scraper", "playwright", "anti-detection", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/moamen1358/Search_news_and_scrape_them"
Repository = "https://github.com/moamen1358/Search_news_and_scrape_them"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E402",  # Module level import not at top of file (needed for warnings.filterwarnings)
    "E501",  # Line too long (cosmetic, not a bug)
    "F401",  # Unused imports (needed for re-exports in __init__.py)
    "W291",  # Trailing whitespace in docstrings/JS strings (cosmetic)
    "W293",  # Blank line whitespace in docstrings/JS strings (cosmetic)
    "B008",  # Function call in default argument (required for FastAPI Depends)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
